[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "retail-layout-optimizer"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["PyJWT[crypto]>=2.10,<3", "httpx==0.28.1", "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic-settings==2.9.1", "SQLAlchemy==2.0.41", "psycopg[binary]==3.2.9", "alembic==1.16.1", "pandas==2.2.3", "numpy==2.2.6", "mlxtend==0.23.4", "openpyxl==3.1.5"]
[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
